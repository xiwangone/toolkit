name: build-synaptic
# CI 构建 Synaptic 二进制（x86_64 + aarch64 交叉编译，仅手动触发，产物上传 artifact）
on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ColinVaughn/Synaptic
          ref: master
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Add aarch64 target + linker
        run: |
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
      - name: Build release (x86_64)
        run: cargo build --release
      - name: Build release (aarch64 cross)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build --release --target aarch64-unknown-linux-gnu
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synaptic-linux-binaries
          path: |
            target/release/synaptic
            target/aarch64-unknown-linux-gnu/release/synaptic
          retention-days: 30
