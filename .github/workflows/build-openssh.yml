name: build-openssh
# 构建 OpenSSH（aarch64/Android，NDK），手动触发，产物上传 artifact
# 构建逻辑与本地共用：scripts/build/build-openssh-android.sh
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK_DIR: /opt/android-ndk-r27c
    steps:
      - uses: actions/checkout@v4

      - name: 准备 NDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl unzip perl make
          if [ ! -d "$NDK_DIR" ]; then
            curl -sL --retry 3 -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
            unzip -q /tmp/ndk.zip -d /opt
          fi
          ls -d /opt/android-ndk-*
          ls "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin" | grep -E "^aarch64-linux-android26-clang$"

      - name: 编译 OpenSSH
        run: |
          bash scripts/build/build-openssh-android.sh "$NDK_DIR" "$RUNNER_TEMP/work" "$RUNNER_TEMP/out" 26

      - name: 收集产物
        run: |
          ls -lR "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@v4
        with:
          name: openssh-aarch64-android
          path: ${{ runner.temp }}/out/
          retention-days: 14
