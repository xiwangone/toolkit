name: build-openssh
# 构建 OpenSSH（aarch64/Android，NDK），手动触发，产物上传 artifact
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 NDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl unzip perl make
          curl -sL --retry 3 -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q /tmp/ndk.zip -d /opt
          echo "== /opt =="; ls -d /opt/android-* 2>/dev/null || ls -la /opt
          NDK_DIR=$(ls -d /opt/android-ndk-* 2>/dev/null | head -1)
          test -n "$NDK_DIR" || { echo "NDK 解压失败"; exit 1; }
          echo "NDK=$NDK_DIR" >> $GITHUB_ENV
          echo "探测到 NDK: $NDK_DIR"
          ls "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin" | grep -E "^aarch64-linux-android26-clang$" || echo "(!) 未找到 26-clang" 

      - name: 编译 OpenSSL
        run: |
          curl -sL --retry 3 -o /tmp/ssl.tgz https://github.com/openssl/openssl/releases/download/openssl-3.0.15/openssl-3.0.15.tar.gz
          tar xzf /tmp/ssl.tgz -C /tmp
          cd /tmp/openssl-3.0.15
          export NDK_ROOT="$NDK"
          B=$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
          export PATH=$B:$PATH
          echo "== 工具链检查 =="; ls -d $B; ls $B | grep -E "^aarch64-linux-android(26|21)-clang$" | head -3
          # OpenSSL 的 android target 硬查 gcc 命名的工具链，用软链接桥接
          for t in gcc g++ clang clang++; do sudo ln -sf $B/aarch64-linux-android26-clang /usr/local/bin/aarch64-linux-android-$t; done
          sudo ln -sf $B/llvm-ar /usr/local/bin/aarch64-linux-android-ar
          sudo ln -sf $B/llvm-ranlib /usr/local/bin/aarch64-linux-android-ranlib
          sudo ln -sf $B/llvm-strip /usr/local/bin/aarch64-linux-android-strip
          echo "== 链接生效? =="; which aarch64-linux-android-gcc; aarch64-linux-android-gcc --version | head -1
          ./Configure android-arm64 -D__ANDROID_API__=26 no-shared no-tests --prefix=/tmp/ssl
          make -j$(nproc) >/tmp/ssl.log 2>&1 || { tail -30 /tmp/ssl.log; exit 1; }
          make install_sw >/dev/null 2>&1

      - name: 编译 OpenSSH
        run: |
          curl -sL --retry 3 -o /tmp/ssh.tgz https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-9.9p2.tar.gz
          tar xzf /tmp/ssh.tgz -C /tmp
          cd /tmp/openssh-9.9p2
          export PATH=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          export CC=aarch64-linux-android26-clang AR=llvm-ar RANLIB=llvm-ranlib
          ./configure --host=aarch64-linux-android \
            --with-ssl-dir=/tmp/ssl \
            --with-privsep-user=root \
            --without-pam --with-sandbox=no --without-zlib-version-check
          make -j$(nproc) sshd sshd-session sftp-server ssh-keygen scp >/tmp/ssh.log 2>&1 || { tail -40 /tmp/ssh.log; exit 1; }

      - name: 收集产物
        run: |
          mkdir -p out
          for f in sshd sshd-session sshd-auth sftp-server ssh-keygen scp; do
            [ -f "/tmp/openssh-9.9p2/$f" ] && cp "/tmp/openssh-9.9p2/$f" out/ || true
          done
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: openssh-aarch64-android
          path: out/
          retention-days: 14
